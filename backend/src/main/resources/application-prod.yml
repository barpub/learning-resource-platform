server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/learning_resource_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: learning_resource
    password: change-me
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0

jwt:
  secret: replace-with-a-long-random-production-secret
  expiration: 86400000

file:
  upload-dir: /data/learning-resource-platform/uploads
  public-prefix: /uploads

app:
  cors:
    allowed-origins:
      - https://example.com

resource-agent:
  lm:
    enabled: true
    base-url: https://meta.tangarcin.de/v1
    model: mimo-v2.5-pro
    api-key: ${RESOURCE_AGENT_LM_API_KEY:}
    timeout-ms: 30000
    max-input-chars: 12000
