server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:learning_resource_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 1000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: local-h2-development-secret-change-in-production
  expiration: 86400000

file:
  upload-dir: ./uploads
  public-prefix: /uploads

media:
  ffmpeg-path: ${FFMPEG_PATH:}
  ffprobe-path: ${FFPROBE_PATH:}
  worker-threads: ${MEDIA_WORKER_THREADS:1}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

resource-agent:
  lm:
    enabled: false
    base-url: https://meta.tangarcin.de/v1
    model: mimo-v2.5-pro
    api-key: ${RESOURCE_AGENT_LM_API_KEY:}
    timeout-ms: 30000
    max-input-chars: 12000
